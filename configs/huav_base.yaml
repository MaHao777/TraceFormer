resolution:
  width: 346
  height: 260
model:
  spatial_block_size_x: 8
  spatial_block_size_y: 8
  num_time_blocks: 64
  token_dim: 32
  event_embed_dim: 16
  num_pool_queries: 4
  num_layers: 3
  num_heads: 4
  mlp_ratio: 2.0
  dropout: 0.1
  cone_heads:
    - {base_radius: 1.0, slope: 0.5, max_time_distance: 4}
    - {base_radius: 1.0, slope: 1.0, max_time_distance: 4}
    - {base_radius: 2.0, slope: 1.5, max_time_distance: 6}
    - {base_radius: 2.0, slope: 2.0, max_time_distance: 8}
  layer_time_scales: [0.5, 0.75, 1.0]
  max_neighbors_per_cone: 8
  causal_mode: false
  direction_dropout: 0.0
  debug_attention_stats: false
inference:
  sigmoid_threshold: 0.5
dataset:
  root: ../../训练集、验证集
  duration_ms: 8000
training:
  device: cpu
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 37
  background_ratio: 10
  max_background_without_positive: 4096
  num_threads: 14
  output_root: ../outputs
  gradient_clip_norm: 1.0
  mixed_precision: false
  mixed_precision_dtype: float16
  max_train_files:
  max_val_files:
loss:
  focal_alpha: 0.75
  focal_gamma: 2.0
  lambda_dice: 0.5
  lambda_false_alarm: 0.05
  false_alarm_logit_margin: 0.0
  false_alarm_topk_per_frame: 32
  lambda_trajectory_position: 1.0
  lambda_trajectory_velocity: 0.5
  trajectory_roi_radius: 16.0
evaluation:
  optimize_threshold: true
  threshold_steps: 19
  frame_ms: 50
  object_correct_fraction: 0.0001
