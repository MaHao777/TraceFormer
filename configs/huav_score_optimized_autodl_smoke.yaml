resolution:
  width: 346
  height: 260
model:
  spatial_block_size_x: 8
  spatial_block_size_y: 8
  num_time_blocks: 64
  token_dim: 48
  event_embed_dim: 64
  num_pool_queries: 4
  num_layers: 3
  num_heads: 4
  mlp_ratio: 2.0
  dropout: 0.1
  cone_heads:
    - {base_radius: 1.0, slope: 0.5, max_time_distance: 4}
    - {base_radius: 1.0, slope: 1.0, max_time_distance: 4}
    - {base_radius: 2.0, slope: 1.5, max_time_distance: 6}
    - {base_radius: 2.0, slope: 2.0, max_time_distance: 8}
  layer_time_scales: [0.5, 0.75, 1.0]
  max_neighbors_per_cone: 8
  causal_mode: false
  direction_dropout: 0.1
  debug_attention_stats: false
inference:
  sigmoid_threshold: 0.5
dataset:
  root: ../data/ev-uav
  duration_ms: 8000
training:
  device: cuda
  epochs: 1
  learning_rate: 0.0007
  weight_decay: 0.0002
  seed: 37
  background_ratio: 12
  hard_negative_fraction: 0.5
  max_background_without_positive: 4096
  dense_sequence_event_threshold: 300000
  dense_sequence_background_polarity_max: 0.65
  dense_sequence_weight: 3.0
  min_learning_rate_ratio: 0.1
  num_threads: 8
  output_root: ../outputs
  gradient_clip_norm: 1.0
  mixed_precision: true
  mixed_precision_dtype: bfloat16
  max_train_files: 4
  max_val_files: 2
loss:
  alpha: 0.55
  gamma_focal: 2.0
  gamma_stc: 2.0
  eta_pos: 0.5
  eta_neg: 0.5
  tau: 50.0
  r0: 8.0
  vmax: 0.128
  sigma_xy: 8.0
  sigma_t: 25.0
  max_neighbors: 32
  lambda_fa: 0.5
  fa_top_k: 32
  fa_negative_margin: -1.0
  fa_temperature: 0.25
evaluation:
  optimize_threshold: true
  threshold_steps: 19
  frame_ms: 50
  object_correct_fraction: 0.0001
