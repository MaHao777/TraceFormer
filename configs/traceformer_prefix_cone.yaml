# 唯一三锥结构：全量池化与中心注意力。
resolution:
  width: 346
  height: 260
model:
  spatial_block_size_x: 8
  spatial_block_size_y: 8
  num_time_blocks: 64
  token_dim: 64
  event_embed_dim: 64
  num_pool_queries: 4
  num_layers: 3
  num_heads: 4
  mlp_ratio: 2.0
  dropout: 0.1
  architecture: prefix_cone
  cone_windows:
  - spatial_radius: 8
    time_horizon: 2
  - spatial_radius: 4
    time_horizon: 4
  - spatial_radius: 2
    time_horizon: 8
inference:
  sigmoid_threshold: 0.5
dataset:
  root: ../data/ev-uav
  duration_ms: 8000
training:
  stage: full
  device: cpu
  epochs: 24
  learning_rate: 0.0007
  weight_decay: 0.0002
  seed: 37
  background_ratio: 12
  hard_negative_fraction: 0.5
  max_background_without_positive: 4096
  dense_sequence_event_threshold: 300000
  dense_sequence_background_polarity_max: 0.65
  dense_sequence_weight: 3.0
  min_learning_rate_ratio: 0.1
  num_threads: 8
  save_training_state_interval: 1
  output_root: ../outputs/prefix_cone
  gradient_clip_norm: 1.0
  mixed_precision: false
  mixed_precision_dtype: float16
  max_train_files: null
  max_val_files: null
loss:
  focal_alpha: 0.75
  focal_gamma: 2.0
  lambda_dice: 0.75
  lambda_object_frame: 0.25
  object_frame_logit_margin: 2.0
  lambda_false_alarm: 0.05
  false_alarm_logit_margin: 0.0
  false_alarm_topk_per_frame: 32
sparse_mixture:
  min_events: 300000
  max_polarity_fraction: 0.65
  threshold_ratio: 1.5
  warmup_epochs: 3
  ramp_epochs: 3
  initial_router_bias: -2.0
  initial_residual_scale: 0.01
  full_aux_loss_weight: 0.0
  sparse_loss_weight: 0.05
  object_frame_consistency_weight: 0.0
  positive_preservation_weight: 0.2
  positive_preservation_margin: 0.0
  background_consistency_weight: 0.01
  background_consistency_margin: 0.0
  sparse_false_peak_weight: 0.01
  sparse_false_peak_logit_margin: 0.0
  sparse_false_peak_topk_per_frame: 8
  sparse_false_peak_block_size_x: 8
  sparse_false_peak_block_size_y: 8
  gate_regularization_weight: 0.001
frame_refinement:
  context_dim: 16
  scales:
  - spatial_block_size_x: 2
    spatial_block_size_y: 2
    frame_ms: 10.0
  - spatial_block_size_x: 4
    spatial_block_size_y: 4
    frame_ms: 25.0
  - spatial_block_size_x: 8
    spatial_block_size_y: 8
    frame_ms: 50.0
  loss_weight: 0.2
evaluation:
  optimize_threshold: true
  threshold_steps: 19
  frame_ms: 50
  object_correct_fraction: 0.0001
