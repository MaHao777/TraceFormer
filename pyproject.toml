[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceformer"
version = "1.0.0"
description = "TraceFormer: multiscale past-cone summaries for event-based tiny UAV segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["torch>=2.10", "numpy", "scipy", "PyYAML", "scikit-learn>=1.3"]

[project.urls]
Repository = "https://github.com/MaHao777/TraceFormer"

[project.scripts]
traceformer-preprocess = "traceformer.cli:preprocess"
traceformer-train = "traceformer.cli:train"
traceformer-evaluate = "traceformer.cli:evaluate"
traceformer-predict = "traceformer.cli:predict"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
