[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceformer"
version = "0.1.0"
description = "TraceFormer: a bidirectional spatiotemporal cone transformer for event-based tiny UAV detection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["torch", "numpy", "scipy", "PyYAML", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
postprocess = ["lightgbm>=4.6,<5"]
experiments = ["psutil>=5.9", "numba>=0.61", "scikit-learn>=1.3"]
gpu = ["numba-cuda[cu12]", "lightgbm>=4.6,<5"]

[project.urls]
Repository = "https://github.com/MaHao777/TraceFormer"

[project.scripts]
traceformer-experiment = "traceformer.cli.experiment:main"
traceformer-train = "traceformer.cli.train:main"
traceformer-evaluate = "traceformer.cli.evaluate:main"
traceformer-predict = "traceformer.cli.predict:main"
traceformer-check-gpu = "traceformer.cli.check_gpu:main"
traceformer-index-outputs = "traceformer.cli.index_outputs:main"
traceformer-visualize = "traceformer.cli.visualize:main"
traceformer-postprocess = "traceformer.cli.postprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
