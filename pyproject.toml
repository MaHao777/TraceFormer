[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huav"
version = "0.1.0"
description = "Sparse spatiotemporal-cone event-level tiny-object detector for HUAV"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["torch", "numpy", "scipy", "PyYAML", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
huav-inspect = "huav.cli.inspect:main"
huav-train = "huav.cli.train:main"
huav-evaluate = "huav.cli.evaluate:main"
huav-predict = "huav.cli.predict:main"
huav-package = "huav.cli.package:main"
huav-check-gpu = "huav.cli.check_gpu:main"
huav-index-outputs = "huav.cli.index_outputs:main"
huav-visualize = "huav.cli.visualize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
